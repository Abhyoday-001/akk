<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Skylay — Disruption Simulator</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="top">
  <div class="brand">
    <svg viewBox="0 0 40 40" width="34" height="34" aria-hidden="true">
      <defs><linearGradient id="sl" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4cc9f0"/><stop offset="1" stop-color="#a78bfa"/></linearGradient></defs>
      <path d="M4 27 L20 31 L36 27" fill="none" stroke="url(#sl)" stroke-width="2.4" stroke-linecap="round" opacity=".45"/>
      <path d="M4 22 L20 26 L36 22" fill="none" stroke="url(#sl)" stroke-width="2.4" stroke-linecap="round" opacity=".75"/>
      <path d="M20 4 L24.5 17 L35 20 L24.5 22.5 L20 30 L15.5 22.5 L5 20 L15.5 17 Z" fill="url(#sl)"/>
    </svg>
    <div><b>Skylay</b><span>Disruption simulator</span></div>
  </div>
  <select id="networkSel" title="Network">
    <option value="india">🇮🇳 India domestic</option>
    <option value="world">🌍 Worldwide</option>
  </select>
  <select id="scenarioSel" title="Scenario"></select>
  <div class="transport">
    <button id="btnPlay" class="btn primary" title="Play / pause (space)">▶ Play</button>
    <button id="btnStepB" class="btn" title="Back 30 min (←)">−30m</button>
    <button id="btnStepF" class="btn" title="Forward 30 min (→)">+30m</button>
    <div class="clock"><span id="clock">08:00</span><small id="clockDay">IST</small></div>
    <input id="scrub" type="range" min="300" max="1800" step="1" value="480" aria-label="Simulation time">
    <select id="speed" title="Playback speed">
      <option value="6">Slow</option><option value="15" selected>Normal</option><option value="40">Fast</option><option value="100">Turbo</option>
    </select>
    <button id="btnRestart" class="btn" title="Back to the start of the day">↺</button>
  </div>
  <div id="hdrScore" class="hdr-score"></div>
  <button id="btnTheme" class="btn" title="Switch light / dark theme">☀ Light</button>
</header>

<main class="grid">
  <aside class="left panel">
    <nav class="tabs" id="leftTabs">
      <button data-tab="scenario" class="on">Weather</button>
      <button data-tab="recovery">Recovery</button>
      <button data-tab="advisor">Advisor</button>
    </nav>
    <div class="tabbody" id="leftBody"></div>
  </aside>

  <section class="center">
    <div class="mapwrap" id="mapWrap">
      <canvas id="map"></canvas>
      <div id="banner" class="banner"></div>
      <div id="detail" class="detail hidden"></div>
      <div class="maptools">
        <div class="seg" id="colorMode"><button data-m="delay" class="on">Delay</button><button data-m="gen">Domino generation</button></div>
        <button class="btn sm" id="btnRecenter">Recenter</button>
      </div>
      <div class="legend" id="legend"></div>
      <div class="plantbar" id="plant"></div>
    </div>
    <div class="bottom panel">
      <nav class="tabs" id="botTabs">
        <button data-tab="gantt" class="on">Rotation schedule</button>
        <button data-tab="board">Flight board</button>
        <button data-tab="fix">Where to fix</button>
        <button data-tab="cascade">Cascade</button>
        <button data-tab="pax">Passengers</button>
        <span class="grow"></span>
        <span id="botExtra" class="botextra"></span>
      </nav>
      <div class="tabbody" id="botBody"></div>
    </div>
  </section>

  <aside class="right panel">
    <div class="tabbody scroll" id="rightBody"></div>
  </aside>
</main>
<div id="tip" class="tip hidden"></div>
<div id="toast" class="toast hidden"></div>

<script src="js/world-topo.js"></script>
<script src="js/data.js"></script>
<script src="js/engine.js"></script>
<script src="js/map.js"></script>
<script src="js/ui.js"></script>
</body>
</html>
